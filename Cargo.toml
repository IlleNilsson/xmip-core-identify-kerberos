# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-identify-kerberos"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-identify-kerberos"
description = "Identify by kerberos: the ticket a Negotiate authorization offers, presented by the realm and service it is for because the client principal is sealed; a transport-layer claim, passed. A xmip-core-identify technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the identifier trait, the arrival and the claim live
# there. The mechanism it reads is declared once in xmip-core (ADR-0050).
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# X.690: the token is DER, read with the estate's one reader.
asn1 = { package = "xmip-core-library-asn1", git = "https://github.com/IlleNilsson/xmip-core-library-asn1", branch = "main" }
# RFC 4648 base64, for the token an Authorization: Negotiate header carries.
base64 = "0.22"

[dev-dependencies]
# The Stream an arrival carries, for the tests that build one.
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
